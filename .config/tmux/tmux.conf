# --- Basic settings ---
set -g prefix `
unbind C-b
bind ` send-prefix

set -g mouse on
set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on
set -s escape-time 0
# tmux-256color knows italics etc.; fall back to screen-256color on hosts whose
# terminfo database lacks it (some older Linux servers).
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal "tmux-256color"' \
    'set -g default-terminal "screen-256color"'
# 24-bit color when the outer terminal is xterm-256color (tmux 3.2+)
set -as terminal-features ",xterm-256color:RGB"

# --- Vim ---
setw -g mode-keys vi

bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
# Copy: pbcopy on macOS. Elsewhere tmux sends the selection to the outer
# terminal via OSC 52, which reaches the local clipboard even over SSH.
if-shell 'command -v pbcopy >/dev/null 2>&1' \
    'bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"' \
    'bind -T copy-mode-vi y send -X copy-selection-and-cancel'

# h, j, k, l
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# split with '|' and '-'
bind | split-window -h
bind - split-window -v

